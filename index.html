<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>動画見比べツール</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: 映像2本が主役の編集卓。上に映像、すぐ下に操作を置き、操作しながら目を離さず見比べられるようにする */
:root{
  --bg:#eef3ee; --surface:#ffffff; --sunken:#e0e9e2; --ink:#14221b; --muted:#566960; --line:#cfd9d1;
  --accent:#0e6b4a; --on-accent:#ffffff; --a:#1368a8; --b:#d9600f; --stage:#0d1512;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --num:"Barlow Condensed","Zen Kaku Gothic New",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#16211b; --sunken:#1e2c25; --ink:#e8f0ea; --muted:#9fb2a7; --line:#2d3c34;
  --accent:#57c596; --on-accent:#08261a; --a:#4a97d6; --b:#d4762a; --stage:#050907; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211b; --sunken:#1e2c25; --ink:#e8f0ea; --muted:#9fb2a7; --line:#2d3c34;
  --accent:#57c596; --on-accent:#08261a; --a:#4a97d6; --b:#d4762a; --stage:#050907; color-scheme:dark}
[hidden]{display:none!important}
.manual-top{display:flex;justify-content:flex-end;padding-top:14px}
.manual-link{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);background:var(--surface);font-weight:700;font-size:.875rem;text-decoration:none}
.manual-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,p{margin:0}
header{padding-top:24px;display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,5vw,2.125rem);line-height:1.3;letter-spacing:.02em}
.lead{color:var(--muted);font-size:.9375rem}

.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:3px;gap:2px}
.seg button{font:inherit;font-weight:700;font-size:.9375rem;border:0;border-radius:6px;background:none;color:var(--muted);padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.notice{font-size:.875rem;color:var(--muted)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:.875rem;cursor:pointer}

.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.clip{display:flex;flex-direction:column;gap:6px;min-width:0}
.clip-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.clip[data-id="a"] .dot{background:var(--a)} .clip[data-id="b"] .dot{background:var(--b)}
.name{flex:1 1 6em;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;min-width:0}
.shot{flex:1 1 auto;font-size:.75rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:760px){.shot{flex:1 0 100%;text-align:left}}
.memo{flex:1 0 100%;font:inherit;font-size:.875rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;min-width:0}
.tag{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap}
.screen{position:relative;background:var(--stage);border-radius:6px;overflow:hidden;aspect-ratio:3/4;max-height:56vh;width:100%}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.flash{position:absolute;left:8px;bottom:8px;background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px}
.hold{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;padding:1px 8px;border-radius:999px}
.readout{font-size:.75rem;line-height:1.4;font-variant-numeric:tabular-nums;color:var(--muted);text-align:center;min-height:3.6em;display:flex;flex-direction:column}
.readout b{font-family:var(--num);font-size:1.25rem;font-weight:600;color:var(--ink)}

.editor{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pick{position:relative;display:block;text-align:center;font-weight:700;font-size:.875rem;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:6px 8px;cursor:pointer}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.range-wrap{position:relative;padding-bottom:26px}
input[type=range]{width:100%;margin:0;accent-color:var(--accent);display:block;height:28px}
.marks{position:absolute;left:8px;right:8px;bottom:14px;height:8px;background:var(--sunken);border-radius:2px}
.marks .kept{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.45;border-radius:2px}
.marks .pt{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:var(--ink)}
.marks .pt.unset{background:var(--muted);opacity:.5}
.marks .pt i{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.625rem;line-height:1;color:var(--ink);font-weight:700}
.marks .pt.unset i{color:var(--muted)}
.pt-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.pt-btns .btn.done{border-color:var(--accent)}
.pt-tools{display:inline-flex;gap:6px;flex-wrap:wrap}
.sync-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync-row .seg button{min-width:40px}
.readout .pts{display:flex;flex-wrap:wrap;justify-content:center;gap:0 8px}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.marksbtn{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1fr)}
.btn{white-space:nowrap;font:inherit;font-size:.8125rem;font-weight:700;background:var(--sunken);color:var(--ink);border:1px solid transparent;border-radius:6px;padding:7px 2px;cursor:pointer;min-width:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 4px;max-width:100%}

.transport{background:var(--surface);padding:8px 12px;display:flex;flex-direction:column;gap:6px;flex:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.coverage{position:relative;height:14px;margin:0 8px}
.cov{position:absolute;height:5px;border-radius:2px}
.cov.a{top:0;background:var(--a)} .cov.b{top:7px;background:var(--b)}
.tick{position:absolute;height:9px;width:3px;margin-left:-1px;background:var(--ink)}
.tick.a{top:-2px} .tick.b{top:5px}
.summary{overflow-x:auto}
.summary table{border-collapse:collapse;width:100%;font-size:.875rem;font-variant-numeric:tabular-nums}
.summary th,.summary td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.summary th:first-child,.summary td:first-child{text-align:left;color:var(--muted);font-weight:500}
.summary thead th{font-weight:700;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.cbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.play-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cbtn{font:inherit;font-weight:700;border:0;border-radius:6px;background:var(--sunken);color:var(--ink);min-height:44px;padding:0 12px;cursor:pointer;font-size:.875rem;white-space:nowrap}
.cbtn.play{background:var(--accent);color:var(--on-accent);min-width:88px;font-size:1rem}
.tau{font-family:var(--num);font-size:1.375rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{display:inline-flex;gap:2px;background:var(--sunken);border-radius:8px;padding:3px}
.speed button{font-family:var(--num);font-size:1rem;font-weight:600;border:0;background:none;color:var(--muted);border-radius:6px;padding:4px 12px;min-height:38px;cursor:pointer;font-variant-numeric:tabular-nums}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.proj-btns{display:inline-flex;flex-wrap:wrap;gap:6px}
.proj-open{position:relative;display:inline-flex;align-items:center}
.proj-open input{position:absolute;width:1px;height:1px;opacity:0}
.proj-open:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.resume{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9375rem}
.proj-note{font-size:.875rem;font-weight:700}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font-size:.875rem}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet-card{background:var(--surface);color:var(--ink);border-radius:10px;padding:16px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet-title{font-family:var(--display);font-weight:400;font-size:1.125rem;margin:0}
.small-text{font-size:.875rem;margin:0}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px}
.ex-progress{display:flex;flex-direction:column;gap:4px}
.ex-bar{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.ex-bar i{display:block;height:100%;width:0;background:var(--accent)}
#ex-preview{width:100%;max-height:44vh;background:#000;border-radius:6px}
@media (max-height:500px){.coverage{display:none}}
/* 見比べる：画面いっぱいを2分割し、操作部は下に寄せる */
body.cmp{overflow:hidden}
body.cmp header,body.cmp .bar,body.cmp #sample-note,body.cmp .resume,body.cmp .proj-note{display:none}
body.cmp main{position:fixed;inset:0;z-index:20;max-width:none;gap:0;background:var(--stage)}
body.cmp .manual-top{flex:none;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));padding-top:calc(6px + env(safe-area-inset-top,0px));background:#000}
body.cmp .manual-link{background:rgba(255,255,255,.14);color:#fff;border-color:transparent;min-height:32px;font-size:.8125rem}
body.cmp .stage{flex:1;min-height:0;gap:2px;grid-template-rows:minmax(0,1fr)}
body.cmp .stage.stack{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}
body.cmp .clip{position:relative;min-height:0;gap:0}
body.cmp .clip-head{flex:none;background:#000;padding:3px 10px}
body.cmp .clip-head .name{color:#fff;background:none;border:0;padding:0;font-size:.875rem}
body.cmp .clip-head .memo{color:#fff;background:none;border:0;padding:0;font-size:.8125rem}
body.cmp .clip-head .memo::placeholder{color:#c3cfc7}
body.cmp .clip-head .tag,body.cmp .clip-head .shot{color:#d8e2db}
body.cmp .screen{flex:1;height:auto;min-height:0;aspect-ratio:auto;max-height:none;border-radius:0;cursor:pointer}
.reveal{position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:999px;font:inherit;font-weight:700;font-size:.875rem;min-height:44px;padding:0 16px;cursor:pointer}
@media (max-width:560px){.editor{padding:8px}.btn{font-size:.75rem}.seg button{padding:6px 10px}}
</style>

<main>
<nav class="manual-top" aria-label="使い方"><a class="manual-link" href="https://doza0324.github.io/douga-mikurabe/manual.html" target="_blank" rel="noopener">マニュアルを見る</a></nav>
<header>
  <h1>動画見比べツール</h1>
  <p class="lead">2本の動画を並べ、記録した地点をそろえて同時に再生し、MP4形式で保存できます。</p>
</header>

<div class="bar">
  <div class="seg" role="group" aria-label="作業">
    <button type="button" id="mode-edit" aria-pressed="true">1 編集する</button>
    <button type="button" id="mode-cmp" aria-pressed="false">2 見比べる</button>
  </div>
  <label class="toggle">コマ送り <select class="step-size" id="step-edit" aria-label="コマ送りの細かさ"><option value="15">1/15秒</option><option value="30" selected>1/30秒</option><option value="60">1/60秒</option><option value="120">1/120秒</option><option value="240">1/240秒</option></select></label>
  <div class="pt-tools">
    <button type="button" class="cbtn" id="pt-add">地点を増やす</button>
    <button type="button" class="cbtn" id="pt-del" hidden>地点を減らす</button>
  </div>
  <div class="proj-btns">
    <button type="button" class="cbtn" id="proj-save">プロジェクト保存</button>
    <label class="cbtn proj-open"><input type="file" id="proj-file" accept=".json,application/json">プロジェクトを開く</label>
  </div>
</div>
<div class="resume" id="resume" hidden>
  <span id="resume-text"></span>
  <span class="proj-btns"><button type="button" class="cbtn" id="resume-open">続きを開く</button><button type="button" class="cbtn" id="resume-clear">消す</button></span>
</div>
<p class="proj-note" id="proj-note" role="status" hidden></p>
<p class="notice" id="sample-note">いまはサンプル動画（架空の棒人形）です。「動画を選ぶ」で入れ替えられます。</p>

<div class="stage" id="stage">
  <div class="clip" data-id="a">
    <div class="clip-head"><span class="dot"></span><input class="name" id="name-a" value="選手A" maxlength="20" aria-label="1人目の名前"><span class="tag" id="tag-a">サンプル</span><span class="shot" id="shot-a" hidden></span><input class="memo" id="memo-a" maxlength="60" placeholder="一言メモ" aria-label="1人目の一言メモ"></div>
    <div class="screen" id="screen-a"><video id="video-a" muted playsinline preload="auto"></video><span class="flash" id="flash-a" hidden></span><span class="hold" id="hold-a" hidden>再生完了</span></div>
    <div class="editor" id="editor-a">
      <label class="pick"><input type="file" id="file-a" accept="video/*">動画を選ぶ</label>
      <div class="range-wrap"><input type="range" id="scrub-a" min="0" max="1" step="0.001" value="0" aria-label="選手Aの再生位置"><div class="marks" id="marks-a"><div class="kept" id="kept-a"></div></div></div>
      <div class="readout" id="read-a"></div>
      <div class="btns"><button type="button" class="btn" id="back-a" aria-label="1コマ戻す">◀</button><button type="button" class="btn" id="toggle-a">再生</button><button type="button" class="btn" id="fwd-a" aria-label="1コマ進める">▶</button></div>
      <div class="pt-btns" id="ptb-a" role="group" aria-label="地点を記録"></div>
    </div>
  </div>
  <div class="clip" data-id="b">
    <div class="clip-head"><span class="dot"></span><input class="name" id="name-b" value="選手B" maxlength="20" aria-label="2人目の名前"><span class="tag" id="tag-b">サンプル</span><span class="shot" id="shot-b" hidden></span><input class="memo" id="memo-b" maxlength="60" placeholder="一言メモ" aria-label="2人目の一言メモ"></div>
    <div class="screen" id="screen-b"><video id="video-b" muted playsinline preload="auto"></video><span class="flash" id="flash-b" hidden></span><span class="hold" id="hold-b" hidden>再生完了</span></div>
    <div class="editor" id="editor-b">
      <label class="pick"><input type="file" id="file-b" accept="video/*">動画を選ぶ</label>
      <div class="range-wrap"><input type="range" id="scrub-b" min="0" max="1" step="0.001" value="0" aria-label="選手Bの再生位置"><div class="marks" id="marks-b"><div class="kept" id="kept-b"></div></div></div>
      <div class="readout" id="read-b"></div>
      <div class="btns"><button type="button" class="btn" id="back-b" aria-label="1コマ戻す">◀</button><button type="button" class="btn" id="toggle-b">再生</button><button type="button" class="btn" id="fwd-b" aria-label="1コマ進める">▶</button></div>
      <div class="pt-btns" id="ptb-b" role="group" aria-label="地点を記録"></div>
    </div>
  </div>
</div>

<section class="transport" id="transport" aria-label="同時再生" hidden>
  <div>
    <input type="range" id="tau" min="-1" max="1" step="0.001" value="0" aria-label="共通の再生位置">
    <div class="coverage" id="coverage"><div class="cov a" id="cov-a"></div><div class="cov b" id="cov-b"></div><div class="tick a" id="tick-a"></div><div class="tick b" id="tick-b"></div></div>
  </div>
  <div class="controls">
    <div class="play-row">
      <button type="button" class="cbtn" id="step-back" aria-label="1コマ戻す">◀</button>
      <button type="button" class="cbtn play" id="play">再生</button>
      <button type="button" class="cbtn" id="to-head">頭出し</button>
      <button type="button" class="cbtn" id="step-fwd" aria-label="1コマ進める">▶</button>
      <button type="button" class="cbtn" id="to-base" hidden>地点へ</button>
    </div>
    <span class="tau" id="tau-read">0.00秒</span>
    <div class="speed" role="group" aria-label="再生速度">
      <button type="button" data-rate="1" aria-pressed="false">1</button>
      <button type="button" data-rate="0.5" aria-pressed="false">1/2</button>
      <button type="button" data-rate="0.25" aria-pressed="true">1/4</button>
      <button type="button" data-rate="0.1" aria-pressed="false">1/10</button>
    </div>
    <label class="toggle">コマ送り <select class="step-size" id="step-cmp" aria-label="コマ送りの細かさ"><option value="15">1/15秒</option><option value="30" selected>1/30秒</option><option value="60">1/60秒</option><option value="120">1/120秒</option><option value="240">1/240秒</option></select></label>
    <label class="toggle"><input type="checkbox" id="loop" checked>くり返す</label>
  </div>
  <div class="controls">
    <div class="sync-row"><span class="toggle">そろえる地点</span><div class="seg" id="sync-seg" role="group" aria-label="そろえる地点"></div></div>
    <div class="play-row">
      <button type="button" class="cbtn" id="compare" aria-pressed="false">比較</button>
      <button type="button" class="cbtn" id="layout" >縦並び表示</button>
      <button type="button" class="cbtn" id="fullscreen" hidden>全画面へ</button>
      <button type="button" class="cbtn" id="hide-ctl">ボタンを隠す</button>
      <button type="button" class="cbtn" id="proj-save-2">プロジェクト保存</button>
      <button type="button" class="cbtn" id="back-edit">編集画面へ</button>
      <button type="button" class="cbtn play" id="export">エクスポート</button>
    </div>
  </div>
  <div class="summary" id="summary" hidden></div>
</section>
<button type="button" class="reveal" id="show-ctl" hidden>操作を表示</button>
<div class="toast" id="toast" role="status" hidden></div>
<div class="sheet" id="ex-sheet" role="dialog" aria-modal="true" aria-label="動画のエクスポート" hidden>
  <div class="sheet-card">
    <h2 class="sheet-title">見比べ動画をエクスポート</h2>
    <p id="ex-info" class="small-text"></p>
    <div class="ex-progress" id="ex-progress" hidden><span id="ex-text" class="small-text"></span><div class="ex-bar"><i id="ex-bar"></i></div></div>
    <video id="ex-preview" muted playsinline controls loop hidden></video>
    <p id="ex-note" class="small-text" role="status"></p>

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let FRAME=1/30; // コマ送り1回で進む秒数
const digits=()=>FRAME<1/40?3:2;
/* 地点：各動画に①〜⑤（初期は3つ）。最初の地点から最後の地点までを切り出して再生する */
const CIRC='①②③④⑤',MINP=3,MAXP=5;
let NPTS=3,syncIdx=0;
const ptName=i=>'地点'+CIRC[i];
const mk=(id,pts)=>{
  const c={id,v:$('video-'+id),url:null,dur:0,pts:[...pts,0,0].slice(0,MAXP),set:[true,true,true,false,false],k:1,sample:true,want:null,lastSeek:0};
  Object.defineProperty(c,'in',{get(){return this.pts[0]}});
  Object.defineProperty(c,'out',{get(){return this.pts[NPTS-1]}});
  return c;
};
const clips=[mk('a',[.7,1.2,2.0]),mk('b',[1.26,1.6,2.5])];
// 未記録の地点は、前後の記録済み地点（なければ動画の最初と最後）の間に均等に置く
function normalize(c){
  const d=c.dur||Math.max(...c.pts.slice(0,NPTS));
  let i=0;
  while(i<NPTS){
    if(c.set[i]){i++;continue}
    let j=i;while(j<NPTS&&!c.set[j])j++;
    const a=i>0?c.pts[i-1]:0,b=j<NPTS?c.pts[j]:d;
    const lo=i>0?a:0,hi=j<NPTS?b:d;
    const n=j-i,first=i===0,last=j===NPTS;
    for(let k=0;k<n;k++){
      let f;
      if(first&&last)f=n===1?0:k/(n-1);
      else if(first)f=n===1?0:k/n;
      else if(last)f=(k+1)/n;
      else f=(k+1)/(n+1);
      c.pts[i+k]=lo+(hi-lo)*f;
    }
    i=j;
  }
}
function setPoint(c,i){
  const t=c.want??c.v.currentTime;

/* 動画ファイルの内部（mvhd）に記録された撮影日時を読む。読めない動画は表示しない */
async function readShot(file){
  const u32=(d,o)=>d.getUint32(o);
  const bytes=async(a,b)=>new DataView(await file.slice(a,b).arrayBuffer());
  let pos=0;
  for(let i=0;i<64&&pos+8<=file.size;i++){
    const h=await bytes(pos,pos+16);
    let size=u32(h,0),head=8;
    const type=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));
    if(size===1){size=u32(h,8)*4294967296+u32(h,12);head=16}
    else if(size===0)size=file.size-pos;
    if(size<8)return null;
    if(type==='moov'){
      const m=await bytes(pos+head,Math.min(pos+size,pos+head+262144));
      let p=0;
      while(p+8<=m.byteLength){
        const sz=u32(m,p);
        const t=String.fromCharCode(m.getUint8(p+4),m.getUint8(p+5),m.getUint8(p+6),m.getUint8(p+7));
        if(sz<8)return null;
        if(t==='mvhd'){
          const v=m.getUint8(p+8);
          const sec=v===1?u32(m,p+12)*4294967296+u32(m,p+16):u32(m,p+12);
          const ms=(sec-2082844800)*1000; // 1904年起点の秒をUNIX時刻へ
          if(ms<Date.UTC(2005,0,1)||ms>Date.now()+864e5)return null;
          return new Date(ms);
        }
        p+=sz;
      }
      return null;
    }
    pos+=size;
  }
  return null;
}

/* 見比べる：τ はそろえる地点を0とした実時間の秒 */
const ready=()=>clips.filter(c=>c.dur>0);
const base=c=>c.pts[syncIdx];
const tauOf=c=>({lo:(c.in-base(c))/c.k,hi:(c.out-base(c))/c.k});
const ptTau=(c,i)=>(c.pts[i]-base(c))/c.k;
const ptAt=(c,t)=>{for(let i=0;i<NPTS;i++)if(c.set[i]&&Math.abs(t-ptTau(c,i))<.04)return i;return -1};
const tauMin=()=>Math.min(...ready().map(c=>tauOf(c).lo));
const tauMax=()=>Math.max(...ready().map(c=>tauOf(c).hi));

const within=(c,t)=>{const r=tauOf(c);return t>=r.lo-1e-3&&t<=r.hi+1e-3};
let tau=0,rate=.25,mode='edit';

function refreshTimeline(){

  r.min=lo;r.max=hi;tau=clamp(tau,lo,hi);r.value=tau;
  const pct=x=>(x-lo)/(hi-lo||1)*100;

    const bar=$('cov-'+c.id);
    if(!c.dur){bar.hidden=true;continue}
    const q=tauOf(c);bar.hidden=false;bar.style.left=pct(q.lo)+'%';bar.style.width=(pct(q.hi)-pct(q.lo))+'%';
  }

}

// 区間ごとの秒数：①→②、②→③…と、最初から最後（全体）
function intervals(){
  const rows=[];
  for(let i=0;i<NPTS-1;i++)rows.push([`${CIRC[i]}→${CIRC[i+1]}`,c=>c.set[i]&&c.set[i+1]?(c.pts[i+1]-c.pts[i])/c.k:null]);
  rows.push([`${CIRC[0]}→${CIRC[NPTS-1]}（全体）`,c=>c.set[0]&&c.set[NPTS-1]?(c.pts[NPTS-1]-c.pts[0])/c.k:null]);
  return rows;
}
function drawLead(){

/* iPhone・iPadでは、遅い再生を動画の再生機能に任せると止まったり飛んだりするため、位置を1コマずつ動かして表示する */
const seekMode=()=>isWebKit&&rate<1;
async function startPlay(){
  const hi=tauMax();
  if(tau>=hi-.01)tau=tauMin();
  $('play').textContent='止める';pb.on=true;
  if(!seekMode()){
    // 押した操作の中で再生を始めないと、iPhone・iPadでは再生が許可されない
    for(const c of ready()){c.v.muted=true;c.v.play().then(()=>{if(!pb.on)c.v.pause()}).catch(e=>{if(pb.on)toast('再生が始まりませんでした（'+(e&&e.name||'不明')+'）。もう一度「再生」を押してください。')})}
  }
  await Promise.all(ready().map(c=>seekDone(c,target(c,tau))));
  if(!pb.on)return;
  pb.t0=performance.now();pb.tau0=tau;
  pb.raf=requestAnimationFrame(tick);

function drive(c,t,now,native){
  const v=c.v;
  if(!native&&seekMode()){
    if(!v.paused)v.pause();
    seekTo(c,target(c,t));
    return;
  }
  if(!within(c,t)){
    if(!v.paused)v.pause();
    const end=target(c,t);
    if(Math.abs(v.currentTime-end)>.02&&!v.seeking)v.currentTime=end;
    return;
  }
  const want=base(c)+t*c.k,speed=rate*c.k;
  const diff=want-v.currentTime;
  if(Math.abs(diff)>.1&&now-c.lastSeek>500&&!v.seeking){
    c.lastSeek=now;v.currentTime=want;
  }else{
    const r=clamp(speed+clamp(diff/.4,-speed*.5,speed*.5),.07,16);
    if(Math.abs(v.playbackRate-r)>speed*.02){try{v.playbackRate=r}catch{}}

}
function tick(now){
  if(!pb.on)return;

    for(const c of clips)c.v.pause();
    if($('loop').checked){
      setTimeout(async()=>{
        if(!pb.on)return;
        tau=tauMin();setLabels(tau);
        await Promise.all(ready().map(c=>seekDone(c,target(c,tau))));
        if(!pb.on)return;
        pb.t0=performance.now();pb.tau0=tau;pb.raf=requestAnimationFrame(tick);
      },450);
    }else stopPlay();
    return;
  }
  tau=t;setLabels(t);
  for(const c of ready())drive(c,t,now);
  pb.raf=requestAnimationFrame(tick);
}

/* エクスポート：1コマずつ位置を合わせて描くので、端末の処理速度に左右されずに2本がそろう */
/* iPhoneなどのWebKitは、止めた動画を移動してもキャンバスに古いコマが写ることがあるため、再生しながら描く */
const isWebKit=/AppleWebKit/.test(navigator.userAgent)&&!/Chrome\/|Chromium|Edg\//.test(navigator.userAgent);
const EX={fps:30,bitrate:6e6,run:null,blob:null,url:null,live:isWebKit};
const RATE_NAME={1:'等速',.5:'1/2スロー',.25:'1/4スロー',.1:'1/10スロー'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const exSeek=(v,t)=>new Promise(res=>{
  if(Math.abs(v.currentTime-t)<.001&&!v.seeking){res();return}
  const done=()=>{clearTimeout(to);v.removeEventListener('seeked',done);res()};
  const to=setTimeout(done,3000);
  v.addEventListener('seeked',done);v.currentTime=t;
});
const even=n=>Math.max(2,Math.round(n/2)*2);
function wrapText(g,text,maxW,maxLines){
  if(!text)return[];
  const out=[];let line='';
  for(const ch of text){
    if(g.measureText(line+ch).width>maxW){
      out.push(line);line=ch;
      if(out.length===maxLines){
        out[maxLines-1]=out[maxLines-1].slice(0,-1)+'…';return out;
      }
    }else line+=ch;
  }
  if(line)out.push(line);
  return out;
}
function exLayout(r){
  const stack=$('stage').classList.contains('stack');
  const a=Math.max(...r.map(c=>(c.v.videoWidth||3)/(c.v.videoHeight||4)));
  const n=r.length;
  let cellW,cellH,W,H;
  if(stack&&n>1){
    W=1080;cellW=W;cellH=Math.min(800,even(W/a));
  }else{
    cellH=1000;cellW=Math.min(1920/n,Math.max(even(cellH*a),540));cellH=Math.min(1000,even(cellW/a));
  }
  const u=Math.max(cellW/n>0?Math.min(cellW,cellH*1.2):1,540)/1000;
  const mg=document.createElement('canvas').getContext('2d');
  const memoFont=`500 ${Math.round(26*u)}px ${getComputedStyle(document.body).fontFamily}`;
  const boxW=(stack&&n>1?1080:cellW)-36*u;
  mg.font=memoFont;
  const memos=Object.fromEntries(r.map(c=>[c.id,wrapText(mg,$('memo-'+c.id).value.trim(),boxW,2)]));
  const memoLines=Math.max(...Object.values(memos).map(x=>x.length));
  const lines=1+memoLines;
  const head=Math.round((16+lines*44)*u),foot=Math.round(68*u);
  if(stack&&n>1)H=even(n*(cellH+head)+foot);else{W=even(n*cellW);H=even(cellH+head+foot)}
  return{W,H,stack:stack&&n>1,cellW:stack&&n>1?W:W/n,cellH,head,foot,u,memos,memoFont};
}
function pill(g,text,x,y,bg,fg,u,right){
  g.font=`700 ${Math.round(26*u)}px ${getComputedStyle(document.body).fontFamily}`;
  const w=g.measureText(text).width+36*u,h=44*u,lx=right?x-w:x;
  g.fillStyle=bg;g.beginPath();g.roundRect(lx,y-h,w,h,h/2);g.fill();
  g.fillStyle=fg;g.textBaseline='middle';g.textAlign='left';g.fillText(text,lx+18*u,y-h/2);
}
/* 各映像の左下に、その選手の秒数を箇条書きで載せる */
function exSummary(g,L,c,x,bottom,font){
  const q=v=>v==null?'未記録':v.toFixed(2)+'秒';
  const rows=intervals().map(([label,fn])=>`・${label} ${q(fn(c))}`);
  const size=Math.round(Math.min(L.cellW*.05,L.cellH*.058)*Math.min(1,3.6/rows.length));
  const lh=size*1.4,pad=size*.5;
  g.font=`700 ${size}px ${font}`;g.textAlign='left';g.textBaseline='middle';
  const w=Math.min(Math.max(...rows.map(t=>g.measureText(t).width))+pad*2,L.cellW-size);
  const h=lh*rows.length+pad*1.4,left=x+size*.4,top=bottom-h-size*.4;
  g.fillStyle='rgba(0,0,0,.68)';g.beginPath();g.roundRect(left,top,w,h,size*.4);g.fill();
  g.fillStyle='#fff';
  rows.forEach((t,i)=>g.fillText(t,left+pad,top+pad*.7+lh*(i+.5),w-pad*2));
}
function exDraw(g,L,r,t){
  const css=getComputedStyle(document.documentElement),font=getComputedStyle(document.body).fontFamily;
  g.fillStyle='#000';g.fillRect(0,0,L.W,L.H);
  r.forEach((c,i)=>{
    const x=L.stack?0:i*L.cellW,y=L.stack?i*(L.cellH+L.head):0,u=L.u;
    g.textAlign='left';g.textBaseline='middle';
    g.fillStyle=css.getPropertyValue('--'+c.id).trim();
    g.beginPath();g.arc(x+26*u,y+30*u,10*u,0,7);g.fill();
    g.fillStyle='#fff';g.font=`700 ${Math.round(32*u)}px ${font}`;
    let shotW=0;
    if(c.shot){
      g.font=`500 ${Math.round(24*u)}px ${font}`;g.textAlign='right';g.fillStyle='#e8f0ea';
      const st=shotText(c.shot);shotW=g.measureText(st).width+24*u;
      g.fillText(st,x+L.cellW-18*u,y+30*u);
      g.textAlign='left';g.fillStyle='#fff';g.font=`700 ${Math.round(32*u)}px ${font}`;
    }
    g.fillText(nameOf(c),x+46*u,y+30*u,L.cellW-60*u-shotW);
    let ly=y+30*u+44*u;
    g.font=L.memoFont;g.fillStyle='#e8f0ea';
    for(let k=0;k<Math.max(...Object.values(L.memos).map(m=>m.length));k++){
      if(L.memos[c.id][k])g.fillText(L.memos[c.id][k],x+18*u,ly);
      ly+=44*u;
    }
    const vy=y+L.head,vw=c.v.videoWidth,vh=c.v.videoHeight,s=Math.min(L.cellW/vw,L.cellH/vh),dw=vw*s,dh=vh*s;
    g.save();
    g.beginPath();g.rect(x,vy,L.cellW,L.cellH);g.clip();
    g.translate(x+L.cellW/2,vy+L.cellH/2);
    g.drawImage(c.v,-dw/2,-dh/2,dw,dh);
    g.restore();
    const bottom=vy+L.cellH-12*u;
    const at=ptAt(c,t);if(at>=0)pill(g,ptName(at),x+12*u,vy+12*u+44*u,'#0e6b4a','#fff',u,false);
    exSummary(g,L,c,x,vy+L.cellH,font);
    const q=tauOf(c),done=t>=q.hi-.02,early=t<q.lo-.001;
    if(done||early)pill(g,done?'再生完了':'再生前',x+L.cellW-12*u,bottom,'rgba(0,0,0,.7)','#fff',u,true);
  });
  g.fillStyle='#16211b';g.fillRect(0,L.H-L.foot,L.W,L.foot);
  g.fillStyle='#fff';g.textBaseline='middle';g.textAlign='left';g.font=`700 ${Math.round(32*L.u)}px ${font}`;
  g.fillText(tauText(t),20*L.u,L.H-L.foot/2);
  g.textAlign='right';g.font=`500 ${Math.round(26*L.u)}px ${font}`;
  g.fillText(RATE_NAME[rate],L.W-20*L.u,L.H-L.foot/2);
}
/* 再生しながら書き出す。所要時間は完成する動画の長さと同じ */
async function exLive(job,r,L,g,lo,hi,encodeNow,getErr,queue){
  await Promise.all(r.map(c=>seekDone(c,target(c,lo))));
  // 後から始まる動画は一度動かして、待機中のコマを確実に描けるようにする
  await Promise.all(r.filter(c=>!within(c,lo)).map(async c=>{
    c.v.playbackRate=1;await c.v.play().catch(()=>{});await sleep(120);c.v.pause();
  }));
  const total=(hi-lo)/rate+1;
  const t0=performance.now();
  let i=0,sent=0;
  try{
    return await new Promise((res,rej)=>{
      const loop=now=>{
        if(job.cancel){res(false);return}
        const err=getErr();if(err){rej(err);return}
        const el=(now-t0)/1000,t=Math.min(hi,lo+el*rate);
        for(const c of r){
          if(t<hi)drive(c,t,now,true);else if(!c.v.paused)c.v.pause();
        }
        if(el>=i/EX.fps){
          exDraw(g,L,r,t);
          if(queue()<=6){encodeNow(sent,Math.round(el*1e6));sent++}
          i=Math.floor(el*EX.fps)+1;
          $('ex-bar').style.width=Math.min(100,Math.round(el/total*100))+'%';
          $('ex-text').textContent=`書き出し中 ${Math.min(el,total).toFixed(0)} / ${Math.ceil(total)} 秒`;
        }
        if(el>=total){res(true);return}
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });
  }finally{
    for(const c of r){c.v.pause();c.v.playbackRate=1}
  }
}
async function pickCodec(L){
  if(typeof VideoEncoder==='undefined')return null;
  for(const codec of['avc1.640028','avc1.4D0028','avc1.42E028']){
    const cfg={codec,width:L.W,height:L.H,bitrate:EX.bitrate,framerate:EX.fps,avc:{format:'avc'}};
    try{if((await VideoEncoder.isConfigSupported(cfg)).supported)return cfg}catch{}
  }
  return null;
}
async function exRender(job){
  const r=ready(),L=exLayout(r),cfg=await pickCodec(L);
  if(!cfg)throw new Error('codec');
  const cv=document.createElement('canvas');cv.width=L.W;cv.height=L.H;
  const g=cv.getContext('2d',{alpha:false});
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:L.W,height:L.H},fastStart:'in-memory',firstTimestampBehavior:'offset'});
  let encErr=null;
  const enc=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>{encErr=e}});
  enc.configure(cfg);
  const lo=tauMin(),hi=tauMax();
  const encodeNow=(i,us)=>{
    const frame=new VideoFrame(cv,{timestamp:us,duration:Math.round(1e6/EX.fps)});
    enc.encode(frame,{keyFrame:i%60===0});frame.close();
  };
  try{
    if(EX.live){
      if(!await exLive(job,r,L,g,lo,hi,encodeNow,()=>encErr,()=>enc.encodeQueueSize))return null;
    }else{
      const N=Math.ceil((hi-lo)/rate*EX.fps)+EX.fps;
      for(let i=0;i<N;i++){
        if(job.cancel)return null;
        if(encErr)throw encErr;
        const t=Math.min(hi,lo+i/EX.fps*rate);
        await Promise.all(r.map(c=>exSeek(c.v,target(c,t))));
        exDraw(g,L,r,t);
        encodeNow(i,Math.round(i*1e6/EX.fps));
        while(enc.encodeQueueSize>4)await sleep(4);
        $('ex-bar').style.width=Math.round((i+1)/N*100)+'%';
        $('ex-text').textContent=`書き出し中 ${i+1} / ${N} コマ`;
        if(i%10===0)await sleep(0);
      }
    }
    await enc.flush();
    if(encErr)throw encErr;
    muxer.finalize();
    return new Blob([muxer.target.buffer],{type:'video/mp4'});
  }finally{
    if(enc.state!=='closed')enc.close();
  }
}
function stampNow(){
  const n=new Date(),p=v=>String(v).padStart(2,'0');
  return `${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}_${p(n.getHours())}${p(n.getMinutes())}`;
}
function exName(){
  const r=ready(),memos=r.map(c=>$('memo-'+c.id).value.trim()).filter(Boolean);
  const stem=[stampNow(),...r.map(nameOf),...memos].join('_')
    .replace(/[\\/:*?"<>|\s　]+/g,'_');
  // 保存時に長すぎる名前が切られても拡張子が残るよう、ここで収める
  const enc=new TextEncoder();let out='';
  for(const ch of stem){if(enc.encode(out+ch).length>220)break;out+=ch}
  return out.replace(/_+$/,'')+'.mp4';
}
function openExport(){
  if(pb.on)stopPlay();
  const L=exLayout(ready()),dur=(tauMax()-tauMin())/rate+1;
  $('ex-info').textContent=`${RATE_NAME[rate]}・${ptName(syncIdx)}でそろえる・${L.stack?'縦':'横'}並び。動画の長さは約${Math.ceil(dur)}秒、大きさは ${L.W}×${L.H} です。`;
  $('ex-note').textContent='';$('ex-progress').hidden=true;$('ex-preview').hidden=true;
  $('ex-start').hidden=false;$('ex-save').hidden=true;$('ex-close').textContent='閉じる';$('ex-bar').style.width='0';
  $('ex-sheet').hidden=false;
  $('ex-start').disabled=false;
  if(inClaude)(async()=>{
    let dl=null;
    try{dl=await claude.use('downloads')}catch{}
    if(!dl){$('ex-start').disabled=true;$('ex-note').textContent=NO_SAVE}
  })();
}
$('export').addEventListener('click',openExport);
$('ex-start').addEventListener('click',async()=>{
  const job={cancel:false};EX.run=job;
  $('ex-start').hidden=true;$('ex-progress').hidden=false;$('ex-close').textContent='中止';$('ex-note').textContent='書き出し中は、この画面を開いたままにしてください。';
  try{
    const blob=await exRender(job);
    if(!blob)return;
    EX.blob=blob;
    if(EX.url)URL.revokeObjectURL(EX.url);
    EX.url=URL.createObjectURL(blob);
    const pv=$('ex-preview');pv.src=EX.url+'#t=0.1';pv.hidden=false;
    $('ex-progress').hidden=true;
    $('ex-note').textContent=`書き出しました（${(blob.size/1048576).toFixed(1)}MB）。内容を確認して保存してください。`;
    $('ex-save').hidden=false;
  }catch(e){
    $('ex-progress').hidden=true;$('ex-start').hidden=false;
    $('ex-note').textContent=e&&e.message==='codec'?'この端末やブラウザはMP4の書き出しに対応していません。ChromeかSafariの最新版でお試しください。':'書き出しに失敗しました。映像の時間を短くするか、別の端末でお試しください。';
  }finally{
    EX.run=null;$('ex-close').textContent='閉じる';
    showTau(tau);
  }
});
$('ex-close').addEventListener('click',()=>{
  if(EX.run){EX.run.cancel=true;$('ex-note').textContent='中止しました。';$('ex-progress').hidden=true;$('ex-start').hidden=false;return}
  $('ex-preview').pause();$('ex-sheet').hidden=true;
});
/* 保存：Claude上ではClaudeの保存機能、それ以外のサイトではスマホは共有画面、PCは通常のダウンロードを使う */
const inClaude=!!window.claude;
const isMobile=/iPhone|iPad|iPod|Android/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isApple=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const NO_SAVE='この画面では保存できません。Claudeにサインインした状態（Claudeのアプリ、またはサインイン済みのブラウザ）でこのページを開いてください。';
// 共有画面は「押した操作の中」で開く必要があるため、最初に同期的に呼ぶ
function saveFile(name,blob){
  if(!inClaude){
    const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
    if(isMobile&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file]}).then(()=>'shared',e=>{throw{code:e&&e.name==='AbortError'?'declined':'unavailable'}});
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    return Promise.resolve('downloaded');
  }
  return (async()=>{
    let dl=null;
    try{dl=await claude.use('downloads')}catch{}
    if(!dl)throw{code:'unavailable'};
    await dl.save({filename:name,data:blob});
    return 'saved';
  })();
}
$('ex-save').addEventListener('click',async()=>{
  const note=$('ex-note');
  try{
    const how=await saveFile(exName(),EX.blob);
    note.textContent=how==='downloaded'?'ダウンロードしました。保存先のフォルダをご確認ください。':isApple?'共有の画面で「ビデオを保存」を選ぶと、写真アプリに入ります。':'保存しました。';
  }catch(e){
    note.textContent=e.code==='unavailable'&&inClaude?NO_SAVE:e.code==='declined'?'保存をやめました。もう一度押すと保存できます。':e.code==='rate_limited'?'確認画面が開いています。閉じてからお試しください。':e.code==='too_large'?'ファイルが大きすぎます。速度を上げるか、範囲を短くしてください。':'保存できませんでした。別のブラウザでお試しください。';
  }
});

/* プロジェクト：編集内容だけをJSONで持つ。動画は再開時に選び直す */
const PROJ={app:'douga-mikurabe',version:2,key:'douga-mikurabe-last'};
let dirtyTimer=0,toastTimer=0;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},4500);
}
function snapshot(){
  const clipsOut={};
  for(const c of clips){
    const p=c.pending;
    clipsOut[c.id]={name:$('name-'+c.id).value,memo:$('memo-'+c.id).value,
      pts:(p?p.pts:c.pts).slice(0,NPTS),set:(p?p.set:c.set).slice(0,NPTS),k:c.k,
      file:p?p.file:(c.file&&!c.sample?{name:c.file.name,size:c.file.size}:null)};
  }
  return{app:PROJ.app,version:PROJ.version,savedAt:new Date().toISOString(),npts:NPTS,syncIdx,rate,stack:layoutChoice,step:Math.round(1/FRAME),clips:clipsOut};
}
function markDirty(){
  if(restoring)return;
  clearTimeout(dirtyTimer);
  dirtyTimer=setTimeout(()=>{
    const snap=snapshot();
    if(!Object.values(snap.clips).some(x=>x.file))return; // サンプルのままなら残さない
    try{localStorage.setItem(PROJ.key,JSON.stringify(snap))}catch{}
  },400);
}
const finite=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0;
// 旧形式（開始・インパクト・終了）も地点①②③として読む
function upgradeProject(p){
  if(!p||p.app!==PROJ.app||!p.clips)return null;
  const out={...p,clips:{}};
  for(const k of ['a','b']){
    const x=p.clips[k];if(!x)return null;
    let pts,set;
    if(Array.isArray(x.pts)){pts=x.pts;set=Array.isArray(x.set)?x.set.map(Boolean):pts.map(()=>true)}
    else if(finite(x.in)&&finite(x.imp)&&finite(x.out)){pts=[x.in,x.imp,x.out];set=[true,!!x.impSet,true]}
    else return null;
    if(pts.length<MINP||pts.length>MAXP||!pts.every(finite))return null;
    out.clips[k]={...x,pts,set};
  }
  out.npts=out.clips.a.pts.length;
  if(out.clips.b.pts.length!==out.npts)return null;
  if(!Number.isInteger(p.syncIdx))out.syncIdx=p.sync==='imp'?1:0;
  return out;
}
const validProject=p=>!!upgradeProject(p);
let restoring=false;
function applyProject(p){
  p=upgradeProject(p);
  restoring=true;
  try{
    if(pb.on)stopPlay();
    setMode('edit');
    NPTS=p.npts;buildPointButtons();
    for(const c of clips){
      const x=p.clips[c.id];
      $('name-'+c.id).value=String(x.name??'').slice(0,20);
      $('memo-'+c.id).value=String(x.memo??'').slice(0,60);
      const data={pts:x.pts.slice(),set:x.set.slice(),file:x.file&&typeof x.file.name==='string'?{name:x.file.name,size:Number(x.file.size)||0}:null};
      c.k=[1,2,4,8].includes(x.k)?x.k:1;
      c.mismatch=false;
      if(data.file&&!(c.file&&!c.sample&&c.file.size===data.file.size)){c.pending=data}
      else{
        c.pending=data;
        if(c.dur)applyPending(c);
        if(c.dur){seekTo(c,c.in);drawEditor(c)}
      }
    }
    setSync(Number.isInteger(p.syncIdx)?p.syncIdx:0);
    if([1,.5,.25,.1].includes(p.rate))setRate(p.rate);
    if([15,30,60,120,240].includes(p.step))setStep(p.step);
    layoutChoice=!!p.stack;
    refreshTimeline();
  }finally{restoring=false}
  drawProjNote();markDirty();
}
function applyPending(c){
  const p=c.pending;c.pending=null;
  const d=c.dur||Infinity;
  for(let i=0;i<NPTS;i++){c.pts[i]=Math.min(p.pts[i],d);c.set[i]=!!p.set[i]}
  normalize(c);
  c.mismatch=!!(p.file&&c.file&&!c.sample&&c.file.size!==p.file.size);
  if(c.mismatch)c.expected=p.file.name;
  drawProjNote();
}
function drawProjNote(){
  const need=clips.filter(c=>c.pending&&c.pending.file).map(c=>`${nameOf(c)}「${c.pending.file.name}」`);
  const bad=clips.filter(c=>c.mismatch).map(c=>`${nameOf(c)}の動画が保存時（${c.expected}）と違うようです。別の動画なら、地点の位置を確認してください。`);
  const msg=[need.length?`動画を選ぶと編集内容が戻ります：${need.join('、')}`:'',...bad].filter(Boolean).join(' ');
  $('proj-note').textContent=msg;$('proj-note').hidden=!msg;
}
async function saveProject(){
  const r=clips.map(nameOf).join('_');
  const name=`${stampNow()}_${r}_プロジェクト.json`.replace(/[\\/:*?"<>|\s\u3000]+/g,'_');
  try{
    await saveFile(name,new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}));
    toast('プロジェクトを保存しました。動画ファイルは別に残しておいてください。');
  }catch(e){
    toast(e.code==='unavailable'&&inClaude?NO_SAVE:e.code==='declined'?'保存をやめました。':e.code==='rate_limited'?'確認画面が開いています。閉じてからお試しください。':'保存できませんでした。別のブラウザでお試しください。');
  }
}
$('proj-save').addEventListener('click',saveProject);
$('proj-save-2').addEventListener('click',saveProject);
$('proj-file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  try{
    const p=JSON.parse(await f.text());
    if(!validProject(p))throw 0;
    $('resume').hidden=true;
    applyProject(p);toast('プロジェクトを開きました。');
  }catch{toast('このファイルは開けません。保存したプロジェクトファイルを選んでください。')}
});
$('resume-open').addEventListener('click',()=>{
  $('resume').hidden=true;
  if(lastWork)applyProject(lastWork);
});
$('resume-clear').addEventListener('click',()=>{
  $('resume').hidden=true;lastWork=null;
  try{localStorage.removeItem(PROJ.key)}catch{}
});
let lastWork=null;
try{
  const p=JSON.parse(localStorage.getItem(PROJ.key)||'null');
  if(validProject(p)){
    lastWork=p;
    const d=new Date(p.savedAt);
    $('resume-text').textContent=`前回の作業が残っています（${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}時${String(d.getMinutes()).padStart(2,'0')}分・${[p.clips.a.name,p.clips.b.name].filter(Boolean).join('、')}）`;
    $('resume').hidden=false;
  }
}catch{}

buildPointButtons();
clips.forEach(c=>loadBlob(c,new Blob([b64(SAMPLE[c.id])],{type:'video/mp4'}),true));
